# Project-level hookup to the .Allinone dispatch hub (read by Codex in a trusted project).
[mcp_servers.aio-hub]
command = '{{MCP}}\runtime\node\node.exe'
args = ['{{MCP}}\protocol\hub\hub.mjs']
env = { AIO_AGENT = "codex", AIO_PROJECT = "__PROJECT__" }
startup_timeout_sec = 30
tool_timeout_sec = 1800